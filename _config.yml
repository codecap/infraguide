title: infraguide.org
description: >
  Labs, guides, articles, tools, certifications and cheat sheets for open
  source private cloud infrastructure. Real deployments, no vendor
  preference.

url: "https://infraguide.org"
baseurl: ""
lang: en

author: infraguide.org

markdown: kramdown
highlighter: rouge

permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-last-modified-at
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: "**/*.pdf"
    values:
      sitemap: false
