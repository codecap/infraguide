<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}" class="site-title">infraguide.org</a>
    <nav class="header-nav">
      <a href="{{ '/learn/' | relative_url }}">learn</a>
    </nav>
  </header>

  {% if page.breadcrumbs %}
  <nav class="breadcrumb">
    <a href="{{ '/' | relative_url }}">infraguide.org</a>
    {% for crumb in page.breadcrumbs %}
      <span class="breadcrumb-sep">/</span>
      {% if crumb.url %}
        <a href="{{ crumb.url | relative_url }}">{{ crumb.name }}</a>
      {% else %}
        <span class="breadcrumb-current">{{ crumb.name }}</span>
      {% endif %}
    {% endfor %}
  </nav>
  {% endif %}

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-row">
      <p>&copy; {{ site.time | date: "%Y" }} socket GmbH</p>
      <nav class="footer-nav">
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="{{ '/imprint/' | relative_url }}">imprint</a>
        <a href="{{ '/privacy/' | relative_url }}">privacy policy</a>
      </nav>
    </div>
  </footer>
</body>
</html>
