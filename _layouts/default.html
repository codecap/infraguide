<!DOCTYPE html>
<html lang="en">
<head>
  <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="a0d95ff2-fbed-4b16-a4a2-5e7c4b244e68" data-blockingmode="auto" type="text/javascript"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/logo/icon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% feed_meta %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — pages" href="{{ '/pages.xml' | absolute_url }}">
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}" class="site-title">
      <img src="{{ '/assets/logo/logo.svg' | relative_url }}" alt="infraguide.org" class="site-logo">
    </a>
    <nav class="header-nav">
      <a href="{{ '/learn/' | relative_url }}">learn</a>
    </nav>
  </header>

  {% if page.breadcrumbs %}
  <nav class="breadcrumb">
    <a href="{{ '/' | relative_url }}">infraguide.org</a>
    {% for crumb in page.breadcrumbs %}
      <span class="breadcrumb-sep">/</span>
      {% if crumb.url %}
        <a href="{{ crumb.url | relative_url }}">{{ crumb.name }}</a>
      {% else %}
        <span class="breadcrumb-current">{{ crumb.name }}</span>
      {% endif %}
    {% endfor %}
  </nav>
  {% endif %}

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-row">
      <div class="footer-left">
        <img src="{{ '/assets/logo/icon.svg' | relative_url }}" alt="" class="footer-icon">
        <p>&copy; {{ site.time | date: "%Y" }} infraguide.org</p>
      </div>
      <nav class="footer-nav">
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="{{ '/imprint/' | relative_url }}">imprint</a>
        <a href="{{ '/privacy/' | relative_url }}">privacy policy</a>
      </nav>
    </div>
  </footer>

  <script type="text/plain" data-cookieconsent="statistics" src="https://www.googletagmanager.com/gtag/js?id=G-BNHX3DX017"></script>
  <script type="text/plain" data-cookieconsent="statistics">
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-BNHX3DX017');
  </script>
</body>
</html>
