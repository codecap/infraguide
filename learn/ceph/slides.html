<h1 id="deploy-ceph-with-cephadm">Deploy Ceph with Cephadm</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># as deploy on deployment host                                              <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
<span class="hljs-built_in">sudo</span> apt install cephadm ceph-common python3-jinja2 -y

<span class="hljs-comment"># create ssh keypair for ceph</span>
<span class="hljs-built_in">sudo</span> ssh-keygen -t rsa -N <span class="hljs-string">&#x27;&#x27;</span> -f /etc/ceph/id_rsa
<span class="hljs-comment"># copy the pub key to ceph nodes</span>
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> cephmon0{1..3} cephosd0{1..3} cephgra01 deployment
<span class="hljs-keyword">do</span>
  ssh  <span class="hljs-variable">$i</span>.mgmt <span class="hljs-string">&#x27;sudo cp /home/deploy/.ssh/authorized_keys /root/.ssh/authorized_keys&#x27;</span>
  ssh-copy-id -f -i /etc/ceph/id_rsa root@<span class="hljs-variable">$i</span>.mgmt
<span class="hljs-keyword">done</span>
</code></pre>

<h1 id="deploy-ceph-with-cephadm-1">Deploy Ceph with Cephadm</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment">#  as deploy on deployment host                                             <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
CEPH_VERSION=<span class="hljs-string">&quot;19.2.1&quot;</span>
CEPH_FSID=<span class="hljs-string">&quot;1959570b-e2e3-4017-a5dc-c7606c5068fd&quot;</span>
CEPH_CONFIG=<span class="hljs-string">&quot;<span class="hljs-variable">$HOME</span>/ceph/initial-ceph.conf&quot;</span>
CEPH_SPEC=<span class="hljs-string">&quot;<span class="hljs-variable">$HOME</span>/ceph/spec.yaml&quot;</span>
CEPH_MON_IP=$(ip -br a | grep strg0 | awk <span class="hljs-string">&#x27;{print $NF}&#x27;</span> | <span class="hljs-built_in">cut</span> -d / -f 1)
CEPH_PUBLIC_NET=<span class="hljs-string">&quot;10.20.21.0/24&quot;</span>
CEPH_CLUSTER_NET=<span class="hljs-string">&quot;10.20.22.0/24&quot;</span>
CEPH_IMAGE=<span class="hljs-string">&quot;registry.wrx.sckt.net/quay/ceph/ceph:v<span class="hljs-variable">$CEPH_VERSION</span>&quot;</span>
SPEC=<span class="hljs-string">&quot;<span class="hljs-variable">$HOME</span>/ceph/spec.yaml&quot;</span>

<span class="hljs-built_in">cd</span> ~/ceph
<span class="hljs-built_in">sudo</span> cephadm --image <span class="hljs-string">&quot;<span class="hljs-variable">$CEPH_IMAGE</span>&quot;</span>                     \
  bootstrap                                            \
    --fsid                        <span class="hljs-variable">$CEPH_FSID</span>           \
    --config                      <span class="hljs-variable">$CEPH_CONFIG</span>         \
    --mon-ip                      <span class="hljs-variable">$CEPH_MON_IP</span>         \
    --cluster-network             <span class="hljs-variable">$CEPH_CLUSTER_NET</span>    \
    --ssh-private-key             /etc/ceph/id_rsa     \
    --ssh-public-key              /etc/ceph/id_rsa.pub \
    --initial-dashboard-password  p@ssw0rd             \
    --dashboard-password-noupdate                      \
    --allow-fqdn-hostname                              \
    --skip-firewalld                                   \
    --single-host-defaults

<span class="hljs-comment"># NOTE: --no-cleanup-on-failure to debug if the bootsrap step fails</span>
<span class="hljs-comment">#       --verbose</span>
<span class="hljs-comment">#       --retry &lt;NR&gt;</span>

<span class="hljs-comment"># wait a moment</span>
<span class="hljs-keyword">until</span> <span class="hljs-built_in">sudo</span> ceph -s | grep -q HEALTH_OK; <span class="hljs-keyword">do</span> <span class="hljs-built_in">sudo</span> ceph -s; <span class="hljs-built_in">sleep</span> 5; <span class="hljs-keyword">done</span>

<span class="hljs-comment"># continue</span>
<span class="hljs-built_in">sudo</span> ceph orch apply -i <span class="hljs-variable">$CEPH_SPEC</span>

</code></pre>

<h3 id="create-client-keys-for-openstack-services">Create client keys for OpenStack services</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># as root on deployment node, create the .keyring files                     <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
<span class="hljs-built_in">cat</span> &gt; /etc/ceph/ceph.client.glance.keyring &lt;&lt;<span class="hljs-string">EOF
[client.glance]
        key = AQBqB/JpuJQKDRAACBv/LtaMfeBa4cG3s/5WCg==
        caps mon = &quot;profile rbd&quot;
        caps osd = &quot;profile rbd pool=volumes, profile rbd pool=images&quot;
EOF</span>
<span class="hljs-built_in">cat</span> &gt; /etc/ceph/ceph.client.cinder.keyring &lt;&lt;<span class="hljs-string">EOF
[client.cinder]
        key = AQB6B/JpY78nKRAA9esk98rCEzyNbCPga83DOQ==
        caps mon = &quot;profile rbd&quot;
        caps osd = &quot;profile rbd pool=volumes, profile rbd pool=vms, profile rbd pool=images&quot;
EOF</span>
<span class="hljs-built_in">cat</span> &gt; /etc/ceph/ceph.client.cinder-backup.keyring &lt;&lt;<span class="hljs-string">EOF
[client.cinder-backup]
        key = AQCMB/JprCiDDRAAPWyW0wv/yQ2UQrf4M+7zZA==
        caps mon = &quot;profile rbd&quot;
        caps osd = &quot;profile rbd pool=backups&quot;
EOF</span>
<span class="hljs-built_in">cat</span> &gt; /etc/ceph/ceph.client.nova.keyring &lt;&lt;<span class="hljs-string">EOF
[client.nova]
        key = AQCgB/JpjgdbKRAA3bYIrDC+PnmvojeEpXClrg==
        caps mon = &quot;profile rbd&quot;
        caps osd = &quot;profile rbd pool=volumes, profile rbd pool=vms, profile rbd pool=images&quot;
EOF</span>
<span class="hljs-built_in">cat</span> &gt; /etc/ceph/ceph.client.openstack.keyring &lt;&lt;<span class="hljs-string">EOF
[client.openstack]
        key = AQCvB/JpqAKsLRAAJHTMBMMNpIwD9DbOFx4e/g==
        caps mon = &quot;profile rbd&quot;
        caps osd = &quot;profile rbd pool=images, profile rbd pool=vms, profile rbd pool=volumes, profile rbd pool=backups&quot;
EOF</span>
<span class="hljs-comment"># Import the .keyring clients</span>
<span class="hljs-keyword">for</span> f <span class="hljs-keyword">in</span> glance cinder cinder-backup nova openstack
<span class="hljs-keyword">do</span>
  <span class="hljs-built_in">chown</span> 0600           /etc/ceph/ceph.client.<span class="hljs-variable">${f}</span>.keyring
  ceph  auth import -i /etc/ceph/ceph.client.<span class="hljs-variable">${f}</span>.keyring
<span class="hljs-keyword">done</span>
</code></pre>

<h1 id="prepare-for-openstack-1">Prepare for OpenStack</h1>

<p><strong>Configure Ceph to be used as backend for OpenStack Swift (Object Storage)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-keyword">for</span> r <span class="hljs-keyword">in</span> $(ceph config dump | grep rgw_frontends | awk <span class="hljs-string">&#x27;{print $1}&#x27;</span>)
<span class="hljs-keyword">do</span>
  <span class="hljs-comment"># Docs: https://docs.ceph.com/en/latest/radosgw/config-ref/#keystone-settings</span>
  <span class="hljs-comment">#       https://documentation.suse.com/ses/7/html/ses-all/cha-ceph-configuration.html#id-1.4.8.2.8.3.6</span>
  <span class="hljs-comment"># ceph config set $r rgw_keystone_verify_ssl     &quot;false&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_url              <span class="hljs-string">&quot;https://keystone.os.svc.wrx.sckt.net&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_api_version      <span class="hljs-string">&quot;3&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_admin_user       <span class="hljs-string">&quot;ceph_rgw&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_admin_password   <span class="hljs-string">&quot;KEYSTONE_ADMIN_PASSWORD&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_admin_project    <span class="hljs-string">&quot;service&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_admin_domain     <span class="hljs-string">&quot;default&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_accepted_roles   <span class="hljs-string">&quot;member, _member_, admin&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_keystone_implicit_tenants <span class="hljs-string">&quot;true&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_enable_apis               <span class="hljs-string">&quot;s3, swift&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_swift_account_in_url      <span class="hljs-string">&quot;true&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_swift_versioning_enabled  <span class="hljs-string">&quot;true&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_s3_auth_use_keystone      <span class="hljs-string">&quot;true&quot;</span>
  ceph config <span class="hljs-built_in">set</span> <span class="hljs-variable">$r</span> rgw_dns_name                  <span class="hljs-string">&quot;s3.svc.wrx.sckt.net&quot;</span>
<span class="hljs-keyword">done</span>

<span class="hljs-built_in">sleep</span> 5;
ceph orch restart rgw.default
</code></pre>

<h1 id="cluster-components">Cluster Components</h1>
<p><strong>Monitor</strong> — daemon responsible for maintaining a master copy of the cluster map. A quorum of 3 is needed at minimum to ensure high availability.</p>
<p><strong>OSD (Object Storage Daemon)</strong> — daemon that handles all data storage, replication and data recovery operations.</p>
<p><strong>Rados Gateway</strong> – The Rados Gateway delivers an API for S3 or Swift to connect directly with Ceph.</p>
<p><strong>Metadata Server</strong> — MDS handles all file operations and uses RADOS objects to store data and file system attributes.</p>
<p><strong>Ceph Manager</strong> — runs alongside the monitor daemons to provide additional monitoring and interfaces to external monitoring and management systems.</p>

<h1 id="cluster-map">Cluster Map</h1>
<p>Ceph maintains all cluster topology, which includes five maps called the &quot;Cluster Map&quot;:</p>
<p><strong>Monitor Map</strong>: Contains the fsid of the cluster, the position, the name, the address and the port of each monitor. It also indicates the current time, when the map was created and the last time it was changed. To view a monitor map, run ceph mon dump.</p>
<p><strong>OSD Map</strong>: Contains the cluster fsid, when the map was last created and modified, a list of pools, replica sizes, PG numbers, a list of OSDs and their status (for example, up, in and down). To view an OSD map, run ceph osd dump.</p>
<footer><a href="https://infraguide.org">infraguide.org</a> | Questions or need a guided workshop? → <a href="mailto:ping@socket.de">ping@socket.de</a></footer>

<p><strong>PG Map</strong>: Contains the PG version, its timestamp, the last epoch of the OSD map, the complete proportions and details of each placement group, such as PG ID, Up Set, Active, PG status (for example, active + clean) and data usage statistics for each pool.</p>

ceph auth get client.guest

ceph-fuse -n client.guest -k /etc/ceph/ceph.client.guest.keyring /mnt/ --client_mds_namespace=testfs

<h1 id="aws-cli-example">aws-cli example</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Install and configure awscli                                              <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
pip3 install awscli awscli-plugin-endpoint

<span class="hljs-built_in">mkdir</span> ~/.aws
<span class="hljs-built_in">cat</span> &gt; ~/.aws/config &lt;&lt;<span class="hljs-string">EOF
[plugins]
endpoint = awscli_plugin_endpoint
[profile default]
s3 =
  endpoint_url = http://s3.strg.wrx.sckt.net
  signature_version = s3v4
  addressing_style = auto
s3api =
  endpoint_url = http://s3.strg.wrx.sckt.net
EOF</span>

<span class="hljs-built_in">cat</span> &gt; ~/.aws/credentials &lt;&lt;<span class="hljs-string">EOF
[default]
aws_access_key_id = {ACCESS_KEY}
aws_secret_access_key = {SECRET_KEY}
EOF</span>

<span class="hljs-comment"># Create a new bucket</span>
aws s3 mb s3://demo-bucket

<span class="hljs-comment"># Upload a file</span>
<span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;This is object data stored in Ceph RGW.&quot;</span> &gt; test.txt
aws s3 <span class="hljs-built_in">cp</span> test.txt s3://demo-bucket/project1/test.txt

<span class="hljs-comment"># Review</span>
aws s3 <span class="hljs-built_in">ls</span> s3://demo-bucket/
aws s3 <span class="hljs-built_in">ls</span> s3://demo-bucket/project1/

<span class="hljs-comment"># Download</span>
aws s3 <span class="hljs-built_in">cp</span> s3://demo-bucket/project1/test.txt /tmp/test.txt
<span class="hljs-built_in">cat</span>  /tmp/test.txt
</code></pre>

<h2 id="update-system-packages-and-reboot">Update system packages and reboot</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Stop ceph services on cephosd03 as root                                   <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
docker ps
systemctl stop ceph.target
docker ps

<span class="hljs-comment"># Check status on deployment as root</span>
ceph status
ceph health detail
ceph osd tree
ceph pg dump
ceph pg dump_stuck
ceph pg dump_stuck unclean

ceph osd <span class="hljs-built_in">set</span> noout

<span class="hljs-comment"># Upgrade and reboot</span>

<span class="hljs-comment"># On cephosd03, start ceph services</span>
systemctl start  ceph.target
docker ps

<span class="hljs-comment"># On deployment check the status</span>
ceph status
ceph health detail
ceph osd tree
ceph pg dump_stuck

ceph osd <span class="hljs-built_in">unset</span> noout
</code></pre>

<h1 id="operations-1">Operations</h1>
<h2 id="upgrade">Upgrade</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Upgrade ceph cluster                                                      <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
VERSION=<span class="hljs-string">&quot;19.2.3&quot;</span>
IMAGE=registry.wrx.sckt.net/quay/ceph/ceph:v<span class="hljs-variable">$VERSION</span>

<span class="hljs-comment"># check</span>
ceph health

<span class="hljs-comment"># order </span>
<span class="hljs-comment"># mgr -&gt; mon -&gt; crash -&gt; osd -&gt; mds -&gt; rgw -&gt; rbd-mirror -&gt; cephfs-mirror -&gt; ceph-exporter -&gt; iscsi -&gt; nfs -&gt; nvmeof</span>

<span class="hljs-comment"># Review versions installed</span>
ceph versions

<span class="hljs-comment"># Review the releases page in browser</span>
<span class="hljs-comment"># https://docs.ceph.com/en/latest/releases/</span>

<span class="hljs-comment"># List available versions</span>
ceph orch upgrade <span class="hljs-built_in">ls</span>

<span class="hljs-comment"># Start an upgrade for mgr, mon</span>
ceph orch upgrade start --image <span class="hljs-variable">$IMAGE</span> --daemon-types mgr,mon

<span class="hljs-comment"># status</span>
ceph orch upgrade status
ceph -W cephadm
ceph versions

<span class="hljs-comment"># stop / continue</span>
<span class="hljs-comment"># ceph orch upgrade stop</span>
<span class="hljs-comment"># ceph orch upgrade start --ceph-version $VERSION</span>

<span class="hljs-comment"># wait for &#x27;in_progress&#x27; to become &#x27;false&#x27;</span>
ceph orch upgrade status

<span class="hljs-comment"># continue to upgrade crash</span>
ceph orch upgrade start --image <span class="hljs-variable">$IMAGE</span> --daemon-types crash

<span class="hljs-comment"># wait for &#x27;in_progress&#x27; to become &#x27;false&#x27;</span>
ceph orch upgrade status

<span class="hljs-comment"># continue to upgrade osd</span>
ceph orch upgrade start --image <span class="hljs-variable">$IMAGE</span> --daemon-types osd
<span class="hljs-comment"># status</span>
ceph -s
ceph health
ceph orch upgrade status

<span class="hljs-comment"># continue with the rest</span>
ceph orch upgrade start --image <span class="hljs-variable">$IMAGE</span>

<span class="hljs-comment"># Check available upgrade version for ceph packages</span>
apt-cache policy ceph-common
apt install -y cephadm-&lt;VERSION&gt; ceph-common-&lt;VERSION&gt;
</code></pre>

<h1 id="replace-a-mon-node">Replace a Mon Node</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f6a7.svg" data-marp-twemoji=""/> on deployment node remove cephmon03 from the cluster                   <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">for</span> l <span class="hljs-keyword">in</span> _admin mds mgr mon nfs rbd-mirror rgw
<span class="hljs-keyword">do</span>
  ceph orch host label <span class="hljs-built_in">rm</span> cephmon03 <span class="hljs-variable">$l</span>
<span class="hljs-keyword">done</span>
ceph orch host drain cephmon03
<span class="hljs-comment"># wait a bit</span>
ceph -s
ceph orch host <span class="hljs-built_in">rm</span> cephmon03

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f6a7.svg" data-marp-twemoji=""/> on cephmon03</span>
systemctl stop ceph.target
<span class="hljs-built_in">rm</span> -rf  /etc/ceph/ /var/lib/ceph/* /var/log/ceph/* /etc/systemd/system/ceph*
systemctl daemon-reload
docker image <span class="hljs-built_in">ls</span> | awk <span class="hljs-string">&#x27;{print $3}&#x27;</span> | xargs docker rmi

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🩺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1fa7a.svg" data-marp-twemoji=""/> on deployment node check status </span>
ceph -s
ceph orch host <span class="hljs-built_in">ls</span>
ceph orch <span class="hljs-built_in">ls</span>
ceph orch ps

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f69a.svg" data-marp-twemoji=""/> Redeploy</span>
ceph orch apply -i spec.yaml

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🩺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1fa7a.svg" data-marp-twemoji=""/> check status on deployment node</span>
ceph -s
ceph orch ps
</code></pre>

<h1 id="replace-an-osd">Replace an OSD</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># List all the OSDs in the cluster, take the last one, check the devices behind <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
ceph osd tree
ceph osd metadata &lt;OSD_NR&gt; | grep device

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4a5.svg" data-marp-twemoji=""/> Let&#x27;s break it, on cephosd03</span>
<span class="hljs-built_in">dd</span> <span class="hljs-keyword">if</span>=/dev/zero of=&lt;DEVICE&gt; bs=1024 count=$((<span class="hljs-number">1024</span>*<span class="hljs-number">10</span>))

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🩺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1fa7a.svg" data-marp-twemoji=""/> check status</span>
ceph osd tree
ceph status
ceph health detail
ceph device <span class="hljs-built_in">ls</span>

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🛠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Tell the cluster not to try to recover</span>
ceph osd <span class="hljs-built_in">set</span> noout
ceph osd <span class="hljs-built_in">set</span> norecover

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f6a7.svg" data-marp-twemoji=""/> Rebuild</span>
ceph orch <span class="hljs-built_in">ls</span> osd --<span class="hljs-built_in">export</span>
ceph orch set-unmanaged   osd.ssd
ceph orch <span class="hljs-built_in">ls</span> osd
ceph osd tree

ceph orch osd <span class="hljs-built_in">rm</span> --zap &lt;OSD_NR&gt; --force
ceph osd purge &lt;OSD_NR&gt; --yes-i-really-mean-it

ceph orch osd <span class="hljs-built_in">rm</span> status
ceph status
ceph health detail

ceph orch daemon <span class="hljs-built_in">rm</span> osd.&lt;OSD.NR&gt; --force
</code></pre>

<h1 id="benchmarking">Benchmarking</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Benchmark a specific OSD</span>
ceph tell osd.2 bench
ceph --format plain tell osd.0 bench
<span class="hljs-comment"># Benchmark all OSDs</span>
ceph tell osd.* bench
ceph --format plain tell osd.* bench

<span class="hljs-comment"># Benchmark on newly created pool + cleanup</span>
ceph osd pool create benchmark 64
rados bench -p benchmark 30 write
rados -p benchmark bench -b 4096 30 write <span class="hljs-comment"># object size 4096</span>
<span class="hljs-comment"># Read benchmark</span>
rados -p benchmark bench 30 write --no-cleanup
rados -p benchmark bench 30 rand
ceph tell mon.\* injectargs <span class="hljs-string">&#x27;--mon-allow-pool-delete=true&#x27;</span>
ceph osd pool delete benchmark benchmark --yes-i-really-really-mean-it

<span class="hljs-comment"># Benchmark on a newly created volume + cleanup</span>
rbd create  --size 1024 <span class="hljs-built_in">test</span>/benchmark
rbd bench-write <span class="hljs-built_in">test</span>/benchmark --io-size 1048576  --io-threads 16 --io-pattern rand
rbd <span class="hljs-built_in">rm</span>  <span class="hljs-built_in">test</span>/benchmark

<span class="hljs-comment"># Benchmark on a newly created volume + cleanup</span>
rbd create  --size 1024 <span class="hljs-built_in">test</span>/benchmark
fio --size=100M --ioengine=rbd --invalidate=0 --direct=1 --numjobs=10 --rw=write --name=fiojob --blocksize_range=4K-512k --iodepth=1 --pool=<span class="hljs-built_in">test</span> --rbdname=benchmark
rbd <span class="hljs-built_in">rm</span>  <span class="hljs-built_in">test</span>/benchmark

</code></pre>
