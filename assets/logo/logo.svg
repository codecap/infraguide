<svg width="458" height="92" viewBox="2.00 -2.00 458.41 92.00" xmlns="http://www.w3.org/2000/svg">
  <title>infraguide logo</title>
  <defs>
    <style>
      @font-face {
        font-family: 'IBM Plex Mono Logo';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'IBM Plex Sans Logo';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 700;
      }
      .infra { font-family: 'IBM Plex Mono Logo', monospace; font-weight: 500; fill: #1B2430; }
      .guide { font-family: 'IBM Plex Sans Logo', sans-serif; font-weight: 700; fill: #1FB6A6; }
